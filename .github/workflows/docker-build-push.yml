name: Build Push and Deploy Backend Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: docker build -t lucastupai/innovatech-backend-ventas:latest .

      - name: Publicar imagen en Docker Hub
        run: docker push lucastupai/innovatech-backend-ventas:latest

      - name: Desplegar en EC2 Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/innovatech-backend
            docker pull lucastupai/innovatech-backend-ventas:latest
            docker-compose up -d backend-ventas
            docker image prune -f